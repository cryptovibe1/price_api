<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Price API Candles</title>
    <style>
      :root {
        --bg: #eef1f7;
        --panel: #ffffff;
        --text: #18212f;
        --muted: #546278;
        --line: #d4dce8;
        --accent: #2f7dd8;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 10%, #ffffff, transparent 45%),
          radial-gradient(circle at 90% 0%, #dfe9ff, transparent 35%),
          var(--bg);
      }

      .wrap {
        position: relative;
        max-width: 1400px;
        margin: 20px auto;
        padding: 0 14px;
      }

      .layout {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .left-sidebar {
        flex: 0 0 264px;
        width: 264px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .main-col {
        flex: 1 1 auto;
        min-width: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(33, 48, 71, 0.08);
      }

      .controls {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(8, minmax(120px, 1fr));
        padding: 14px;
      }

      .load-top {
        grid-column: 10;
        grid-row: 1;
      }

      .load-top #load {
        padding: 6px 0;
        font-size: 12px;
        min-height: 30px;
      }

      .settings-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 10px 0 10px;
      }

      .settings-head-actions {
        display: flex;
        gap: 6px;
      }

      .settings-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }

      .settings-toggle {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        padding: 6px 10px;
        cursor: pointer;
      }

      .settings-side-toggle {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        padding: 6px 10px;
        cursor: pointer;
      }

      .settings-body.hidden {
        display: none;
      }

      .ma-settings-card {
        position: fixed;
        top: 10px;
        right: 10px;
        width: min(286px, calc(100% - 24px));
        z-index: 5;
      }

      .ma-settings-card.left {
        top: clamp(90px, 22vh, 220px);
        left: 10px;
        right: auto;
      }

      .connection-settings-card {
        position: fixed;
        top: 10px;
        right: 10px;
        width: min(286px, calc(100% - 24px));
        z-index: 5;
      }

      .connection-settings-card.left {
        top: clamp(280px, 48vh, 460px);
        left: 10px;
        right: auto;
      }

      .connection-settings-card.collapsed {
        width: min(244px, calc(100% - 24px));
      }

      .connection-settings-card.collapsed .settings-head {
        padding: 8px 10px;
      }

      .connection-settings-card.collapsed .settings-title {
        font-size: 13px;
      }

      .connection-settings-card.collapsed .settings-head-actions {
        gap: 6px;
      }

      .connection-settings-card.collapsed .settings-side-toggle,
      .connection-settings-card.collapsed .settings-toggle {
        padding: 6px 10px;
        font-size: 12px;
      }

      .connection-settings-body {
        padding: 8px 10px 10px 10px;
        display: grid;
        gap: 6px;
      }

      .connection-settings-body.hidden {
        display: none;
      }

      #connection-settings-drag-handle {
        cursor: move;
        user-select: none;
      }

      #ma-settings-drag-handle {
        cursor: move;
        user-select: none;
      }

      .connection-settings-body label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 3px;
      }

      .connection-settings-body input,
      .connection-settings-body select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px;
        font-size: 14px;
        background: #fff;
      }

      .ma-settings-body {
        padding: 8px 10px 10px 10px;
      }

      .ma-list {
        display: grid;
        gap: 6px;
      }

      .ma-row {
        display: grid;
        grid-template-columns: 1fr 82px;
        align-items: center;
        gap: 6px;
      }

      .ma-row .check {
        margin-top: 0;
      }

      .ma-row .ma-period {
        margin-top: 0;
      }

      .ma-settings-body label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 3px;
      }

      .ma-settings-body input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px;
        font-size: 14px;
        background: #fff;
      }

      .controls label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .controls input,
      .controls select,
      .controls button {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px;
        font-size: 14px;
        background: #fff;
      }

      .controls button {
        margin-top: 18px;
        background: linear-gradient(180deg, #3e8ce6, #2f7dd8);
        color: #fff;
        border: none;
        font-weight: 600;
        cursor: pointer;
      }

      .controls button.secondary {
        background: #ffffff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
        font-size: 13px;
        color: var(--text);
      }

      .wide {
        grid-column: span 2;
      }

      .check input {
        width: 20px;
        height: 20px;
        margin: 0;
        accent-color: var(--accent);
      }

      .toggle-btn {
        width: 100%;
        margin-top: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        background: #ffffff;
        cursor: pointer;
      }

      .controls #log-scale-toggle,
      .controls #auto-fit,
      .controls #flip-chart {
        margin-top: 0;
        white-space: nowrap;
      }

      #log-scale-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        background: #ffffff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      #log-scale-toggle.active {
        background: linear-gradient(180deg, #3e8ce6, #2f7dd8);
        color: #ffffff;
        border-color: transparent;
      }

      #log-scale-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #stretch-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        background: #ffffff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      #stretch-toggle.active {
        background: linear-gradient(180deg, #3e8ce6, #2f7dd8);
        color: #ffffff;
        border-color: transparent;
      }

      #stretch-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #measure-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        background: #ffffff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      #measure-toggle.active {
        background: linear-gradient(180deg, #3e8ce6, #2f7dd8);
        color: #ffffff;
        border-color: transparent;
      }

      #measure-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #auto-fit,
      #auto-mode-toggle,
      #flip-chart {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        background: #ffffff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      #auto-mode-toggle.active,
      #flip-chart.active {
        background: linear-gradient(180deg, #3e8ce6, #2f7dd8);
        color: #ffffff;
        border-color: transparent;
      }

      #auto-fit svg,
      #auto-mode-toggle svg,
      #flip-chart svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .drawings-body {
        padding: 8px 10px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .drawings-section-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }

      .drawing-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 12px;
        color: var(--text);
        padding: 3px 0;
        border-bottom: 1px solid var(--line);
      }

      .drawing-row:last-child {
        border-bottom: none;
      }

      .drawing-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .drawing-delete {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: #e5484d;
        font-size: 11px;
        padding: 2px 6px;
        cursor: pointer;
        line-height: 1.4;
      }

      .drawing-delete:hover {
        background: #e5484d;
        color: #fff;
        border-color: transparent;
      }

      .drawings-empty {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
      }

      .controls #load {
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .controls #load:disabled {
        opacity: 0.9;
        cursor: wait;
      }

      #load .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: load-spin 0.75s linear infinite;
      }

      #load.loading .spinner {
        display: inline-block;
      }

      @keyframes load-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .toggle-btn.active {
        color: #ffffff;
        background: linear-gradient(180deg, #3e8ce6, #2f7dd8);
        border-color: transparent;
      }

      #log-scale {
        display: none;
      }

      .chart {
        margin-top: 12px;
        padding: 12px;
        position: relative;
      }

      #status {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      #hover-info {
        margin-top: 4px;
        font-size: 13px;
        color: #2a3650;
      }

      #hover-tooltip {
        position: absolute;
        display: none;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 12px;
        color: #fff;
        background: rgba(24, 33, 47, 0.9);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        pointer-events: none;
        z-index: 6;
        white-space: nowrap;
      }

      #fib-popup {
        position: fixed;
        top: clamp(470px, 74vh, calc(100vh - 180px));
        left: 10px;
        right: auto;
        display: none;
        width: min(290px, calc(100% - 28px));
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 20px rgba(23, 36, 56, 0.12);
        z-index: 6;
      }

      #fib-popup-drag-handle {
        margin: -2px 0 8px 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        cursor: move;
        user-select: none;
      }

      #fib-popup-info {
        margin: 0 0 8px 0;
        font-size: 12px;
        color: #2a3650;
      }

      #fib-popup .fib-popup-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      #fib-popup .toggle-btn {
        padding: 8px;
        font-size: 12px;
      }

      #cursor-vline {
        position: absolute;
        display: none;
        top: 12px;
        height: min(72vh, 640px);
        width: 1px;
        background: rgba(42, 54, 80, 0.55);
        pointer-events: none;
        z-index: 5;
      }

      #rsi-cursor-vline {
        position: absolute;
        display: none;
        top: 12px;
        width: 1px;
        background: rgba(42, 54, 80, 0.55);
        pointer-events: none;
        z-index: 5;
      }

      #cursor-hline {
        position: absolute;
        display: none;
        left: 0;
        width: 100%;
        height: 1px;
        background: rgba(42, 54, 80, 0.5);
        pointer-events: none;
        z-index: 5;
      }

      #last-price-tag {
        position: absolute;
        display: none;
        /* JS sets left/top to the right edge of the plot, level with the price.
           The element grows leftward and is vertically centred on that point. */
        transform: translate(-100%, -50%);
        padding: 2px 7px;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #fff;
        background: #2f7dd8;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(23, 36, 56, 0.25);
        white-space: nowrap;
        pointer-events: none;
        z-index: 6;
        /* Glide vertically as the price moves rather than jumping. */
        transition: top 0.16s ease-out;
      }

      #last-price-tag.flash-up {
        background: #1d8e4c;
        animation: last-price-pulse 0.45s ease-out;
      }

      #last-price-tag.flash-down {
        background: #c63838;
        animation: last-price-pulse 0.45s ease-out;
      }

      @keyframes last-price-pulse {
        0% {
          transform: translate(-100%, -50%) scale(1);
          box-shadow: 0 2px 6px rgba(23, 36, 56, 0.25);
        }
        30% {
          transform: translate(-100%, -50%) scale(1.22);
          box-shadow: 0 0 0 4px rgba(47, 125, 216, 0.18),
            0 4px 12px rgba(23, 36, 56, 0.35);
        }
        100% {
          transform: translate(-100%, -50%) scale(1);
          box-shadow: 0 2px 6px rgba(23, 36, 56, 0.25);
        }
      }

      #cursor-strip {
        position: relative;
        height: 24px;
        margin-top: 2px;
      }

      #cursor-time-label {
        position: absolute;
        display: none;
        transform: translateX(-50%);
        top: 2px;
        font-size: 12px;
        color: #2a3650;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
        white-space: nowrap;
        pointer-events: none;
      }

      canvas {
        width: 100%;
        height: min(72vh, 640px);
        border-radius: 8px;
      }

      #rsi-chart {
        height: min(36vh, 320px);
      }

      /* Cards live in the consolidated left sidebar (normal flow). */
      .left-sidebar > .panel {
        position: static;
        top: auto;
        left: auto;
        right: auto;
        bottom: auto;
        width: auto;
        margin: 0;
        z-index: auto;
      }

      .left-sidebar #fib-popup {
        position: static;
        display: block;
        top: auto;
        left: auto;
        right: auto;
        width: auto;
        padding: 0;
        border: none;
        background: transparent;
        box-shadow: none;
        z-index: auto;
      }

      .left-sidebar #ma-settings-drag-handle,
      .left-sidebar #connection-settings-drag-handle,
      .left-sidebar #fib-popup-drag-handle {
        cursor: default;
      }

      .tools-body {
        padding: 8px 10px 10px 10px;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .tool-cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .tool-label {
        font-size: 12px;
        color: var(--muted);
      }

      #figure-trash {
        position: absolute;
        display: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        transform: translate(-50%, -50%);
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #ffffff;
        color: #e5484d;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.25);
        z-index: 6;
      }

      #figure-trash:hover {
        background: #e5484d;
        color: #ffffff;
        border-color: transparent;
      }

      #figure-trash svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tool-cell .toggle-btn {
        margin-top: 0;
        min-height: 38px;
      }

      .tools-body #fib-popup-drag-handle {
        margin: 10px 0 6px 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
      }

      @media (max-width: 980px) {
        .layout {
          flex-direction: column;
        }

        .left-sidebar {
          flex: 1 1 auto;
          width: auto;
        }

        .controls {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }

        .wide {
          grid-column: span 2;
        }

        .load-top {
          grid-column: auto;
          grid-row: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="layout">
        <aside class="left-sidebar">
          <div id="tools-card" class="panel tools-card">
            <div class="settings-head">
              <div class="settings-title">Tools</div>
            </div>
            <div class="tools-body">
              <div class="tool-grid">
                <div class="tool-cell">
                  <span class="tool-label">Stretch</span>
                  <button
                    id="stretch-toggle"
                    class="toggle-btn"
                    type="button"
                    aria-label="Stretch Off"
                    title="Stretch Off"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 3v18" />
                      <path d="m12 3-3 3" />
                      <path d="m12 3 3 3" />
                      <path d="m12 21-3-3" />
                      <path d="m12 21 3-3" />
                    </svg>
                  </button>
                </div>
                <div class="tool-cell">
                  <span class="tool-label">Price range</span>
                  <button
                    id="measure-toggle"
                    class="toggle-btn"
                    type="button"
                    aria-label="Price Percent Off"
                    title="Price Percent Off"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M7 4v16" />
                      <path d="m7 4-2 3" />
                      <path d="m7 4 2 3" />
                      <path d="m7 20-2-3" />
                      <path d="m7 20 2-3" />
                      <path d="M12 18 20 6" />
                      <circle cx="13" cy="7" r="1.5" />
                      <circle cx="19" cy="17" r="1.5" />
                    </svg>
                  </button>
                </div>
                <div class="tool-cell">
                  <span class="tool-label">Fib</span>
                  <button id="fib-toggle" class="toggle-btn" type="button">Fib Off</button>
                </div>
                <div class="tool-cell">
                  <span class="tool-label">Line</span>
                  <button id="line-toggle" class="toggle-btn" type="button" aria-pressed="false">Line Off</button>
                </div>
              </div>
              <div id="fib-popup">
                <div id="fib-popup-drag-handle">Fibonacci Tool</div>
                <p id="fib-popup-info">Move cursor over chart to use Fibonacci tool</p>
              </div>
            </div>
          </div>

      <div id="ma-settings-card" class="panel ma-settings-card left">
        <div class="settings-head">
          <div id="ma-settings-drag-handle" class="settings-title">Moving Average</div>
          <div class="settings-head-actions">
            <button id="settings-toggle" class="settings-toggle" type="button">Hide</button>
          </div>
        </div>
        <div id="settings-body" class="ma-settings-body settings-body">
          <div class="ma-list">
            <div class="ma-row">
              <label class="check" for="ma1-enabled"><input id="ma1-enabled" type="checkbox" checked />MA 1</label>
              <input id="ma1-period" class="ma-period" type="number" min="2" step="1" value="13" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma2-enabled"><input id="ma2-enabled" type="checkbox" checked />MA 2</label>
              <input id="ma2-period" class="ma-period" type="number" min="2" step="1" value="21" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma3-enabled"><input id="ma3-enabled" type="checkbox" checked />MA 3</label>
              <input id="ma3-period" class="ma-period" type="number" min="2" step="1" value="34" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma4-enabled"><input id="ma4-enabled" type="checkbox" checked />MA 4</label>
              <input id="ma4-period" class="ma-period" type="number" min="2" step="1" value="55" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma5-enabled"><input id="ma5-enabled" type="checkbox" />MA 5</label>
              <input id="ma5-period" class="ma-period" type="number" min="2" step="1" value="89" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma6-enabled"><input id="ma6-enabled" type="checkbox" />MA 6</label>
              <input id="ma6-period" class="ma-period" type="number" min="2" step="1" value="144" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma7-enabled"><input id="ma7-enabled" type="checkbox" />MA 7</label>
              <input id="ma7-period" class="ma-period" type="number" min="2" step="1" value="233" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma8-enabled"><input id="ma8-enabled" type="checkbox" />MA 8</label>
              <input id="ma8-period" class="ma-period" type="number" min="2" step="1" value="377" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma9-enabled"><input id="ma9-enabled" type="checkbox" />MA 9</label>
              <input id="ma9-period" class="ma-period" type="number" min="2" step="1" value="610" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma10-enabled"><input id="ma10-enabled" type="checkbox" />MA 10</label>
              <input id="ma10-period" class="ma-period" type="number" min="2" step="1" value="987" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma11-enabled"><input id="ma11-enabled" type="checkbox" />MA 11</label>
              <input id="ma11-period" class="ma-period" type="number" min="2" step="1" value="1597" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma12-enabled"><input id="ma12-enabled" type="checkbox" />MA 12</label>
              <input id="ma12-period" class="ma-period" type="number" min="2" step="1" value="2584" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma13-enabled"><input id="ma13-enabled" type="checkbox" />MA 13</label>
              <input id="ma13-period" class="ma-period" type="number" min="2" step="1" value="4181" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma14-enabled"><input id="ma14-enabled" type="checkbox" />MA 14</label>
              <input id="ma14-period" class="ma-period" type="number" min="2" step="1" value="6765" />
            </div>
            <div class="ma-row">
              <label class="check" for="ma15-enabled"><input id="ma15-enabled" type="checkbox" />MA 15</label>
              <input id="ma15-period" class="ma-period" type="number" min="2" step="1" value="10946" />
            </div>
          </div>
        </div>
      </div>

      <div id="connection-settings-card" class="panel connection-settings-card left">
        <div class="settings-head">
          <div id="connection-settings-drag-handle" class="settings-title">Connection Settings</div>
          <div class="settings-head-actions">
            <button id="connection-settings-toggle" class="settings-toggle" type="button">Hide</button>
          </div>
        </div>
        <div id="connection-settings-body" class="connection-settings-body">
          <div>
            <label for="api-base">API Base</label>
            <input id="api-base" value="http://127.0.0.1:7878" />
          </div>
          <div>
            <label for="db">Database</label>
            <select id="db">
              <option value="postgres">postgres</option>
              <option value="duckdb">duckdb</option>
              <option value="timescale">timescale</option>
              <option value="clickhouse">clickhouse</option>
            </select>
          </div>
        </div>
      </div>

          <div id="drawings-card" class="panel">
            <div class="settings-head">
              <div class="settings-title">Drawings</div>
            </div>
            <div class="drawings-body">
              <div>
                <div class="drawings-section-title">Fibonacci</div>
                <div id="fib-list"><span class="drawings-empty">None</span></div>
              </div>
              <div>
                <div class="drawings-section-title">Lines</div>
                <div id="lines-list"><span class="drawings-empty">None</span></div>
              </div>
            </div>
          </div>

        </aside>

        <main class="main-col">
      <div class="panel">
        <div class="controls">
          <div>
            <label for="chart-source">Chart Source</label>
            <select id="chart-source">
              <option value="btc_usd">btc_usd</option>
              <option value="eth_usd">eth_usd</option>
              <option value="sol_usd">sol_usd</option>
              <option value="xau_usd">xau_usd</option>
              <option value="eth_btc">eth_btc</option>
              <option value="sol_btc">sol_btc</option>
              <option value="btc_xau">btc_xau</option>
              <option value="sol_eth">sol_eth</option>
            </select>
          </div>
          <div>
            <label for="period">Period</label>
            <input id="period" value="1day" />
          </div>
          <div class="wide">
            <label for="ts-start-human">ts_start</label>
            <input id="ts-start-human" type="datetime-local" />
          </div>
          <div class="wide">
            <label for="ts-end-human">ts_end</label>
            <input id="ts-end-human" type="datetime-local" />
          </div>
          <div>
            <button id="load" type="button">
              <span class="spinner" aria-hidden="true"></span>
              <span class="label">Load</span>
            </button>
          </div>
          <div>
            <label for="log-scale-toggle">Scale</label>
            <input id="log-scale" type="checkbox" />
            <button
              id="log-scale-toggle"
              class="toggle-btn"
              type="button"
              aria-label="Log Off"
              title="Log Off"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 19V5" />
                <path d="M5 19h14" />
                <path d="M8 16l3-4 3 2 5-7" />
                <path d="m18 7 1-3 3 1" />
              </svg>
            </button>
          </div>
          <div>
            <label for="auto-fit">Auto fit</label>
            <button
              id="auto-fit"
              class="toggle-btn"
              type="button"
              aria-label="Auto fit chart"
              title="Auto fit chart"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 9V3h6" />
                <path d="M21 9V3h-6" />
                <path d="M3 15v6h6" />
                <path d="M21 15v6h-6" />
              </svg>
            </button>
          </div>
          <div>
            <label for="auto-mode-toggle">Auto</label>
            <button
              id="auto-mode-toggle"
              class="toggle-btn"
              type="button"
              aria-label="Auto Off"
              title="Auto Off"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 9V3h6" />
                <path d="M21 9V3h-6" />
                <path d="M3 15v6h6" />
                <path d="M21 15v6h-6" />
                <path d="M12 8v8" />
                <path d="M8 12h8" />
              </svg>
            </button>
          </div>
          <div>
            <label for="flip-chart">Flip</label>
            <button
              id="flip-chart"
              class="toggle-btn"
              type="button"
              aria-label="Flip chart"
              title="Flip chart (invert Y axis)"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12h18" />
                <path d="m8 7-5 5 5 5" />
                <path d="m16 7 5 5-5 5" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="panel chart">
        <canvas id="chart" width="1200" height="640"></canvas>
        <div id="cursor-vline"></div>
        <div id="cursor-hline"></div>
        <div id="last-price-tag"></div>
        <div id="hover-tooltip"></div>
        <button
          id="figure-trash"
          type="button"
          aria-label="Delete drawing"
          title="Delete drawing"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
        </button>
        <div id="cursor-strip"><div id="cursor-time-label"></div></div>
        <div id="status">Waiting for data...</div>
        <div id="hover-info">Hover chart to see candle time</div>
      </div>

      <div class="panel chart">
        <canvas id="rsi-chart" width="1200" height="220"></canvas>
        <div id="rsi-cursor-vline"></div>
      </div>
        </main>
      </div>
    </div>

    <link data-trunk rel="rust" />
  </body>
</html>
